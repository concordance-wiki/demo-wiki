version: 1
project:
  name: Concordance
  locale: en
  theme: ./theme.yaml
  edit_url: https://github.com/concordance-wiki/demo-{source}/edit/main/{path}
  # Where a call to action leads when no forge link can be built for it, the
  # lead of a word without a note for instance: the repositories of the wiki.
  contribute_url: https://github.com/orgs/concordance-wiki/repositories
profile: ./profile.yaml
plugins:
  # The readers, the converter and the contract importer the briefs and the
  # specifications need; the published preset ships them all, the workflow
  # exposes them from the checkout of the tool until then. The transcripts
  # are read by the VTT reader, the decks and their PDF previews by the
  # office reader and converted by LibreOffice, the contract of the model
  # query API imported by the OpenAPI plugin.
  - "@concordance-wiki/plugin-reader-vtt"
  - "@concordance-wiki/plugin-reader-office"
  - "@concordance-wiki/plugin-convert-libreoffice"
  - "@concordance-wiki/plugin-contract-openapi"
applications:
  # The command line is the default application of both sources; the screens
  # are re-filed under the site by a typing rule, the lint process under the
  # linter by its frontmatter.
  - id: concordance-cli
    title: Concordance command line
    status: active
  - id: concordance-site
    title: Generated site
    status: active
  - id: concordance-linter
    title: Distributed linter
    status: active
domains:
  # Every domain claims the files that have a folder of its name on their path,
  # in both sources: `ingestion/sources/source.md` of the glossary and
  # `objects/ingestion/source.md` of the specifications are filed together. A
  # subdomain declared by folder claims the files whose segment sits under its
  # parent's (`inference/recognition/`, `objects/inference/recognition/`). The
  # families of the specifications whose folder is named after a type rather
  # than a domain are claimed by a glob; a note filed elsewhere says its domain
  # in frontmatter.
  # No declaration files the briefs: neither a folder of a domain's name on
  # their path, nor a glob, nor a frontmatter `domain` on the minutes. The
  # proposal under `inference.domains` files each session and each framing
  # deck from the graph, next to the terms it names.
  - id: ingestion
    title: Ingestion
    folder: true
    subdomains:
      - id: typing
        title: Typing and filing
        folder: true
  - id: inference
    title: Inference
    folder: true
    match: ["api/**"]
    subdomains:
      - id: recognition
        title: Recognition
        folder: true
  - id: publication
    title: Publication
    folder: true
    match: ["screens/**", "viewers/**"]
  - id: quality
    title: Quality
    folder: true
    match: ["rules/**"]
privacy:
  # The README of a content repository describes the repository, not the tool.
  exclude: ["README.md"]
  # The transcripts of the briefs name the fictional participants of the
  # corpus; the dictionary maps each name to a stable pseudonym and the build
  # replaces the names before anything reads a transcript. The dictionary is
  # committed because the names are invented; a real wiki keeps it out of every
  # public repository. Transcripts are published only because this says so.
  pseudonymize: { enabled: true, dictionary: ./pseudonyms.yaml }
  publish_transcripts: true
sources:
  - name: glossary
    git: https://github.com/concordance-wiki/demo-glossary.git
    ref: main
    locale: en
    type: term
    glossary: true
    application: concordance-cli
    # The title names the space wherever the site shows it; the name stays the
    # first segment of every identifier and of every address.
    title: Glossary
    description: The vocabulary of Concordance, one note per term, filed by domain.
    # The folders of the repository are the domains; the site titles and
    # describes them on the page of the space, in the tree and in the breadcrumbs.
    folders:
      ingestion:
        title: Ingestion
        description: Sources, documents, typing, configuration and the pipeline that reads them.
      ingestion/typing:
        title: Typing
      inference:
        title: Inference
        description: Recognition, links, contracts and the canonical model.
      inference/recognition:
        title: Recognition
      publication:
        title: Publication
        description: The site, its pages and its search.
      quality:
        title: Quality
        description: Checks, findings, the linter and the plugins.
  - name: specs
    git: https://github.com/concordance-wiki/demo-specs.git
    ref: main
    locale: en
    application: concordance-cli
    title: Specifications
    description: The typed notes of the tool, screens, processes, rules, objects, APIs, roles and decisions.
    folders:
      screens:
        title: Screens
        description: What a reader sees and does, page by page and panel by panel.
      screens/pages:
        title: Pages
      screens/panels:
        title: Panels
      viewers:
        title: Viewers
        description: The two viewers the site embeds, for documents and for contracts.
      processes:
        title: Processes
        description: The build, the lint and the release, end to end.
      rules:
        title: Rules
        description: What the build checks, one rule per check.
      rules/links:
        title: Links
      rules/documents:
        title: Documents
      rules/vocabulary:
        title: Vocabulary
      rules/identifiers:
        title: Identifiers
      rules/contracts:
        title: Contracts
      rules/sources:
        title: Sources
      rules/engine:
        title: Engine
      objects:
        title: Business objects
        description: Source, resource, entity, link, finding and the others the model carries.
      api:
        title: APIs
        description: The contracts the tool exposes and consumes, and their operations.
      roles:
        title: Roles
        description: Who reads, writes, integrates and owns what.
      batches:
        title: Batches
        description: The recurring jobs around the build.
      data:
        title: Tables
        description: The tables of the canonical model, one note each.
      decisions:
        title: Decisions
        description: The structuring decisions and what they affect.
    # A note no rule names is a decision: `decisions/` is only a filing
    # convention, and a note dropped in an unlisted folder such as `notes/`
    # gets the same type.
    default_type: decision
    rules:
      # A folder glob; the rule also moves the screens to the application of the site.
      - match: { path: "screens/**" }
        set: { type: screen, application: concordance-site }
      # A file name pattern: the two viewers live in their own folder. The
      # folder is part of the glob because `**/*-viewer.md` would also catch
      # the decision about the contract viewer.
      - match: { path: "viewers/*-viewer.md" }
        set: { type: screen, application: concordance-site }
      - match: { path: "processes/**" }
        set: { type: process }
      # A suffix, stripped from the identifier: `rules/links/broken-link.rule.md`
      # is `specs/rules/links/broken-link`. No path rule types the rules.
      - match: { suffix: ".rule.md" }
        set: { type: rule }
      - match: { path: "objects/**" }
        set: { type: business_object }
      # Two rules match the operations; the last one wins.
      - match: { path: "api/**" }
        set: { type: api }
      - match: { path: "api/operations/**" }
        set: { type: endpoint }
      - match: { path: "roles/**" }
        set: { type: role }
      - match: { path: "batches/**" }
        set: { type: batch }
      # The tables under `data/` carry `type: data_object` in their frontmatter.
  - name: briefs
    git: https://github.com/concordance-wiki/demo-briefs.git
    ref: main
    locale: en
    application: concordance-cli
    title: Briefs
    description: The working sessions of the project, each a folder of minutes, transcript and deck, and the framing decks.
    folders:
      meetings:
        title: Meetings
        description: One folder per working session, its minutes, its transcript and its deck.
      framing:
        title: Framing
        description: The decks that frame the project, with their notes.
    # What no rule names is a document: the framing decks, their previews and
    # their notes. The decks go through LibreOffice at build.
    default_type: document
    convert: true
    rules:
      # A folder glob types the sessions, every file of the folder alike: the
      # minutes, the transcript, the deck and its preview, which the build then
      # groups into one page.
      - match: { path: "meetings/**" }
        set: { type: meeting }
      # An extension: a transcript is a meeting wherever it is filed.
      - match: { ext: [".vtt"] }
        set: { type: meeting }
staleness:
  warn_after_days: { default: 120 }
inference:
  glossary_sources: [glossary]
  # Several files combine: general English, the words of this corpus, the words of the site.
  stopwords: [./stopwords.en.txt, ./stopwords.domain.txt, ./stopwords.publication.txt]
  keyword_pages: { min_occurrences: 3, min_files: 2 }
  neighbours: { k: 50 }
  # The domains the graph proposes for the notes nothing files, the briefs:
  # every term whose note has 10 to 60 neighbours is a pivot, a hub such as
  # `build` or `note` is not, and a note within two steps of a pivot joins the
  # pivot's domain. `assign` files the note with the origin `inferred`; without
  # it the proposal stays a finding and a section of the build log.
  domains: { min_neighbours: 10, max_neighbours: 60, radius: 2, assign: true }
build:
  output: ./dist
  fail_on: { errors: true, unconverted_max: 10 }
lock: ./concordance.lock.yaml
