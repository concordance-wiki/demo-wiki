version: 1
project:
  name: Concordance
  locale: en
  theme: ./theme.yaml
  edit_url: https://github.com/concordance-wiki/demo-{source}/edit/main/{path}
profile: ./profile.yaml
applications:
  # The command line is the default application of both sources; the screens
  # are re-filed under the site by a typing rule, the lint process under the
  # linter by its frontmatter.
  - id: concordance-cli
    title: Concordance command line
    status: active
  - id: concordance-site
    title: Generated site
    status: active
  - id: concordance-linter
    title: Distributed linter
    status: active
domains:
  # Every domain claims the files that have a folder of its name on their path,
  # in both sources: `ingestion/sources/source.md` of the glossary and
  # `objects/ingestion/source.md` of the specifications are filed together. A
  # subdomain declared by folder claims the files whose segment sits under its
  # parent's (`inference/recognition/`, `objects/inference/recognition/`). The
  # families of the specifications whose folder is named after a type rather
  # than a domain are claimed by a glob; a note filed elsewhere says its domain
  # in frontmatter.
  - id: ingestion
    title: Ingestion
    folder: true
    subdomains:
      - id: typing
        title: Typing and filing
        folder: true
  - id: inference
    title: Inference
    folder: true
    match: ["api/**"]
    subdomains:
      - id: recognition
        title: Recognition
        folder: true
  - id: publication
    title: Publication
    folder: true
    match: ["screens/**", "viewers/**"]
  - id: quality
    title: Quality
    folder: true
    match: ["rules/**"]
privacy:
  # The README of a content repository describes the repository, not the tool.
  exclude: ["README.md"]
sources:
  - name: glossary
    git: https://github.com/concordance-wiki/demo-glossary.git
    ref: main
    locale: en
    type: term
    glossary: true
    application: concordance-cli
  - name: specs
    git: https://github.com/concordance-wiki/demo-specs.git
    ref: main
    locale: en
    application: concordance-cli
    # A note no rule names is a decision: `decisions/` is only a filing
    # convention, and a note dropped in an unlisted folder such as `notes/`
    # gets the same type.
    default_type: decision
    rules:
      # A folder glob; the rule also moves the screens to the application of the site.
      - match: { path: "screens/**" }
        set: { type: screen, application: concordance-site }
      # A file name pattern: the two viewers live in their own folder. The
      # folder is part of the glob because `**/*-viewer.md` would also catch
      # the decision about the contract viewer.
      - match: { path: "viewers/*-viewer.md" }
        set: { type: screen, application: concordance-site }
      - match: { path: "processes/**" }
        set: { type: process }
      # A suffix, stripped from the identifier: `rules/links/broken-link.rule.md`
      # is `specs/rules/links/broken-link`. No path rule types the rules.
      - match: { suffix: ".rule.md" }
        set: { type: rule }
      - match: { path: "objects/**" }
        set: { type: business_object }
      # Two rules match the operations; the last one wins.
      - match: { path: "api/**" }
        set: { type: api }
      - match: { path: "api/operations/**" }
        set: { type: endpoint }
      - match: { path: "roles/**" }
        set: { type: role }
      - match: { path: "batches/**" }
        set: { type: batch }
      # The tables under `data/` carry `type: data_object` in their frontmatter.
staleness:
  warn_after_days: { default: 120 }
inference:
  glossary_sources: [glossary]
  # Several files combine: general English, the words of this corpus, the words of the site.
  stopwords: [./stopwords.en.txt, ./stopwords.domain.txt, ./stopwords.publication.txt]
  keyword_pages: { min_occurrences: 3, min_files: 2 }
  neighbours: { k: 50 }
build:
  output: ./dist
  fail_on: { errors: true, unconverted_max: 10 }
lock: ./concordance.lock.yaml
