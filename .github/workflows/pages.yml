name: wiki

# Builds the Concordance project wiki from its glossary, its specifications and
# its briefs and publishes it on GitHub Pages: on every push to this repository,
# every morning, on manual dispatch, and on the `content-updated` dispatch the
# three content repositories send after a green lint on their main branch.
#
# The build runs the published preset through npx: the command line with every
# official plugin hoisted next to it, at the version named in the two steps that
# call it, as the pipelines guide of the tool shows. The container image variant
# of that guide carries LibreOffice and removes the "Install LibreOffice" step
# too.
#
# One human step: in the settings of this repository, set Pages → Source to
# "GitHub Actions" once.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Install LibreOffice
        # The decks of the briefs are converted to PDF at build by the
        # LibreOffice plugin; without the command the plugin disables itself
        # with a finding and the decks stay downloadable, without preview.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress libreoffice-writer
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .concordance-cache
          key: concordance-cache-${{ github.run_id }}
          restore-keys: concordance-cache-
      # The published preset: the command line with every official plugin hoisted next to it, which
      # is what the guides tell a reader to run. Nothing of the tool's unreleased code runs in this
      # repository, which can write its own Pages. Bump the version here when the tool is released.
      - run: npx --yes @concordance-wiki/concordance@0.4.0 validate-config
      - name: Build the wiki
        # The sources are cloned at their `main` ref; an error finding fails here, as build.fail_on says.
        # The conversion cache lives in .concordance-cache, restored above, so an unchanged deck is never reconverted.
        run: npx --yes @concordance-wiki/concordance@0.4.0 build
      - name: Summary
        # The findings per severity and per check of dist/build.log.json, on the page of the run.
        run: |
          {
            echo "## Wiki build"
            node -e 'const s = require("./dist/build.log.json").summary.findings; for (const [k, v] of [...Object.entries(s.bySeverity), ...Object.entries(s.byCheck)]) console.log(`- ${k}: ${v}`)'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
