# Paths are relative to this file: the mark and the favicon are copies of the
# brand files, so that the site fetches nothing from another host. The mark is
# inlined in the header, its three lines drawn in currentColor so that they
# follow the ink of either colour scheme.
name: Concordance
logo: brand/concordance-mark.svg
favicon: brand/favicon.svg
# One family for everything: no serif, no display face.
font:
  ui: Instrument Sans
  mono: IBM Plex Mono
radius: 8
light:
  bg: "#F6F5F2"
  surface: "#FFFFFF"
  soft: "#F2F0EB"
  border: "#E4E1DA"
  ink: "#16181B"
  muted: "#3A3E44"
  label: "#5E636B"
  accent: "#B84820"
  highlight: "#FBE3D4"
# The dark palette of the default theme: a second palette measured on its own,
# never an inversion of the light one, the accent raised to hold 4.5:1.
dark:
  bg: "#0F1113"
  surface: "#181B1E"
  soft: "#22262A"
  border: "#282C31"
  ink: "#ECEAE6"
  muted: "#A8AEB6"
  label: "#8D939B"
  accent: "#E8703A"
  highlight: "#4A2A1B"
default_mode: system
footer:
  text: The wiki of the Concordance project, built by Concordance from its own glossary and specifications.
  links:
    - { label: Source code, url: "https://github.com/concordance-wiki/concordance" }
    - { label: Glossary, url: "https://github.com/concordance-wiki/demo-glossary" }
    - { label: Specifications, url: "https://github.com/concordance-wiki/demo-specs" }
    - { label: Briefs, url: "https://github.com/concordance-wiki/demo-briefs" }
  # The project's own wiki credits the tool; a white-label installation leaves this out.
  credit: true
